# Déploiement 100 % gratuit sur Render (https://render.com) + une base de données gratuite.
# Le plan gratuit de Render n'a pas de disque permanent : renseignez UPSTASH_REDIS_REST_URL/TOKEN (conseillé),
# ou DATABASE_URL (Neon, MongoDB Atlas), ou SUPABASE_URL/SUPABASE_SECRET_KEY. Mettez « - » dans les autres.
services:
  - type: web
    name: ainai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
