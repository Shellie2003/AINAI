# Déploiement 100 % gratuit sur Render (https://render.com) + Supabase pour les données.
# Le plan gratuit de Render n'a pas de disque permanent : les données vont dans Supabase (gratuit).
services:
  - type: web
    name: ainai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
